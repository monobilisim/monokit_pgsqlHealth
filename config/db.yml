postgresql:
  process-limit: 50 # Process alarm threshold
  active-query-limit: 30 # Active queries at the same time
  connection-limit-percent: 70 # 70% of max_connections
  credentials:
    mode: "manual" # "manual" for host, port, user, password, dbname or "string" from connection-string
    connection-string: "postgres://postgres:1234@localhost:5432" # if mode is "string", this will be used to connect to the database
    # If mode is "manual", the following parameters will be used to connect to the database
    host: "localhost"
    port: 5432
    user: "postgres"
    password: "1234"
    dbname: "postgres"
  long-query:
    enabled: true
    duration: 60 # In seconds
  pmm-agent:
    enabled: false
  alarm:
    enabled: true
  wal-g:
    enabled: false
    verify-hour: "03:00" # 24h HH:MM; the daily wal-g verify runs when the plugin runs in this minute
    run-as-user: "postgres" # wal-g is executed as this OS user when the plugin runs as root
  patroni:
    enabled: false
    config-path: "/etc/patroni/patroni.yml"
    leader-switch-hook: "" # shell command executed when this node becomes the leader
  consul:
    enabled: false
    url: "http://localhost:8500"
    dns-port: 8600
  haproxy:
    enabled: false
    config-path: "/etc/haproxy/haproxy.cfg"
  # Not implemented yet, can be added in the future versions
  cluster:
    enabled: false
    cluster-type: "patroni" # pgpool, patroni
    size: 3
    receive-queue-limit: 10
    flow-control-limit: 0.20
